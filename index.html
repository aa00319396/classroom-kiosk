<!doctype html>
<html lang="zh-Hant">
<head>

<title>教室多功能白板 V2.3｜多角度教學版</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#15263d;background:#eaf0f8;--blue:#2164cf;--border:#cdd8e7;--card:#fff}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none}button,input,select,textarea{font:inherit}button,select{touch-action:manipulation}button{border:1px solid var(--border);background:white;color:#223853;border-radius:11px;min-height:39px;cursor:pointer;font-weight:650;user-select:none;-webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #83b5ff;outline-offset:2px}button:hover{background:#f0f5fd}button:disabled{opacity:.44;cursor:default}button.primary,.active{background:#e3eeff;border-color:#7ea8ed;color:#1657b1}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-bottom:1px solid var(--border);padding:6px 12px;min-height:54px}.branding{display:flex;align-items:center;gap:10px;min-width:0}.logo{font-size:25px;background:#e8f0ff;border-radius:12px;width:39px;height:39px;display:grid;place-items:center}.brandtext{min-width:0}.brandtext strong{display:block;white-space:nowrap;font-size:18px;letter-spacing:.2px}.brandtext small{display:block;color:#677990;white-space:nowrap;font-size:11px}.headerActions,.toolbar,.controls,.foot,.toolgroup{display:flex;align-items:center;gap:6px}.headerActions{flex-wrap:nowrap}.headerActions button{white-space:nowrap;padding:0 10px;font-size:13px;min-height:37px}.app{height:100dvh;min-height:0;display:flex;flex-direction:column}.toolbar{padding:7px 10px 6px;background:#fff;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--border);gap:5px}.tool{min-height:51px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;min-width:58px}.tool .ico{font-size:22px;line-height:24px}.tool.current{color:white;background:#2466ce;border-color:#2466ce;box-shadow:0 2px 5px #225ab32b}.controls{background:#f8fbff;border-bottom:1px solid var(--border);padding:5px 12px;justify-content:center;flex-wrap:wrap;min-height:46px;gap:9px}.controlGroup{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;font-weight:650}.swatch{width:27px;height:27px;border-radius:50%;min-height:27px;border:2px solid #e8edf4;box-shadow:0 0 0 1px #9eaec1}.swatch.selected{outline:3px solid #255caa;outline-offset:2px}.swatch[data-color="#111827"]{background:#111827}.swatch[data-color="#e33139"]{background:#e33139}.swatch[data-color="#2167d8"]{background:#2167d8}.swatch[data-color="#16834a"]{background:#16834a}input[type=range]{width:98px;accent-color:#2466ce}select{background:white;border:1px solid #c4d4e6;border-radius:9px;min-height:34px;padding:0 7px;max-width:150px}.controlGroup output{width:38px;color:#52657c;font-size:12px}.checkLabel{display:flex;align-items:center;gap:4px;color:#47576c;font-size:12px}.checkLabel input{width:17px;height:17px;accent-color:#256bd0}.workspace{flex:1;min-height:0;padding:10px;display:grid;place-items:center;position:relative;overflow:hidden;background-color:#e5edf7;background-image:radial-gradient(#cfdae8 1px,transparent 1px);background-size:18px 18px}.stage{position:relative;background:white;box-shadow:0 8px 30px #21375632;outline:1px solid #ccd5e2;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none}.stage.select-mode canvas{cursor:default}.stage.eraser-mode canvas{cursor:cell}.foot{background:#fff;border-top:1px solid var(--border);min-height:56px;justify-content:space-between;padding:6px 12px;gap:8px}.footGroup{display:flex;align-items:center;gap:5px;white-space:nowrap}.foot button{padding:0 9px;font-size:13px}.pageInfo{font-size:13px;font-weight:700;color:#4e6181}.footerHint{font-size:12px;color:#6b7d91;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:310px}.status{position:fixed;z-index:30;bottom:68px;left:50%;transform:translateX(-50%);pointer-events:none;background:#1a2d46;color:white;border-radius:12px;box-shadow:0 7px 24px #132c4966;padding:10px 17px;font-weight:600;font-size:13px;max-width:min(90vw,600px);text-align:center;opacity:0;transition:opacity .2s}.status.show{opacity:1}.modalBackdrop{position:fixed;inset:0;background:#13253e8a;z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modalBackdrop.open{display:flex}.dialog{width:min(540px,100%);background:white;box-shadow:0 20px 55px #071b3573;border-radius:17px;padding:22px;max-height:min(88dvh,730px);overflow:auto}.dialog h2{font-size:20px;margin:0 0 8px}.dialog p,.dialog li{color:#4e6178;font-size:14px;line-height:1.7}.dialog textarea{display:block;width:100%;min-height:130px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:20px}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dialog .actions button{padding:0 16px}.dialog button.emphasis{background:#2466ce;color:white;border-color:#2466ce}.dialog .fieldRow{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px}.dialog input[type=number]{width:84px;border:1px solid var(--border);border-radius:8px;padding:6px}.dialog kbd{padding:2px 5px;border:1px solid #bdc9d8;border-radius:4px;background:#f3f6fb}.hidden{display:none!important}
@media(max-width:1080px){.brandtext small{display:none}.tool{min-width:51px;padding:4px 6px}.tool .ico{font-size:20px}.headerActions button{padding:0 7px}.footerHint{display:none}.controls{gap:7px}}
@media(max-width:680px){.top{padding:4px 6px;min-height:43px}.branding{gap:5px}.logo{font-size:20px;width:32px;height:32px}.brandtext strong{font-size:14px}.headerActions{gap:3px}.headerActions button{font-size:10px;min-height:32px;padding:0 4px}.headerActions #undoBtn,.headerActions #redoBtn{font-size:0;min-width:29px;padding:0 2px}.headerActions #undoBtn:before{content:"↶";font-size:20px}.headerActions #redoBtn:before{content:"↷";font-size:20px}.brandtext strong{font-size:12px}.brandtext strong span{display:none}.logo{display:none}.toolbar{padding:4px;gap:3px}.tool{min-width:46px;min-height:43px;font-size:10px;padding:3px 4px}.tool .ico{font-size:17px;line-height:18px}.controls{padding:4px 6px;gap:6px}.foot{min-height:74px;padding:4px 5px;flex-wrap:wrap;justify-content:center;gap:3px}.footGroup{width:100%;gap:3px;justify-content:center;flex-wrap:nowrap}.foot button{font-size:11px;min-height:30px;padding:0 5px}.pageInfo{display:none}.footGroup #prevBtn,.footGroup #nextBtn{font-size:0;min-width:29px;padding:0 3px}.footGroup #prevBtn:before{content:"‹";font-size:19px}.footGroup #nextBtn:before{content:"›";font-size:19px}.footGroup #pageSelect{max-width:79px}.controlGroup{font-size:11px}input[type=range]{width:76px}select{min-height:30px}}
@media(min-width:681px) and (max-width:900px){.foot{flex-wrap:wrap;justify-content:center;gap:3px}.footGroup{justify-content:center}}
@media(max-height:620px){.tool{min-height:43px}.toolbar{padding:4px}.workspace{padding:5px}.controls{min-height:37px;padding:3px}.foot{min-height:44px}}

/* V2.1 — compact bottom toolbars: maximize the 16:9 drawing canvas. */
.app{height:100dvh;min-height:0;overflow:hidden}
.top{flex:0 0 auto;min-height:43px;padding:4px 10px;gap:6px}
.logo{width:31px;height:31px;font-size:19px;border-radius:8px}
.brandtext strong{font-size:15px}
.brandtext small{font-size:10px}
.headerActions{gap:4px}
.headerActions button{min-height:32px;padding:0 8px;font-size:12px}
.workspace{order:1;flex:1 1 auto;min-height:0;padding:3px}
.toolbar{order:2;flex:0 0 auto;min-height:43px;padding:4px 8px;display:flex;justify-content:center;flex-wrap:nowrap;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain}
.tool{flex:0 0 auto;min-height:35px;min-width:55px;padding:4px 7px;flex-direction:row;gap:4px;font-size:12px;line-height:1.1;border-radius:8px}
.tool .ico{font-size:18px;line-height:1}
.controls{order:3;flex:0 0 auto;min-height:37px;padding:3px 8px;display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;overscroll-behavior-x:contain}
.controlGroup{gap:4px;font-size:12px}
.swatch{width:23px;height:23px;min-height:23px}
input[type=range]{width:74px}
.controls select{min-height:30px;padding:0 5px;max-width:115px}
.controls>button{min-height:29px;padding:0 7px;font-size:11px;border-radius:7px;flex-shrink:0}
.checkLabel{font-size:11px}
.checkLabel input{width:15px;height:15px}
.foot{order:4;flex:0 0 auto;min-height:41px;padding:4px 8px;flex-wrap:nowrap;justify-content:space-between;gap:5px}
.footGroup{gap:4px}
.foot button{min-height:30px;padding:0 7px;font-size:11px;border-radius:7px}
.foot select{min-height:30px}
.pageInfo{font-size:11px}
.footerHint{display:none}
@media(max-width:1380px){.toolbar,.controls{justify-content:flex-start}}
@media(max-width:680px){
 .top{min-height:39px;padding:3px 6px}
 .brandtext strong{font-size:12px}
 .headerActions button{min-height:30px;padding:0 4px;font-size:10px}
 .toolbar{min-height:39px;padding:3px 4px;gap:3px}
 .tool{min-width:46px;min-height:33px;padding:3px 5px;font-size:10px;gap:3px}
 .tool .ico{font-size:16px;line-height:1}
 .controls{min-height:35px;padding:3px 6px;gap:7px}
 .controlGroup{font-size:11px}
 input[type=range]{width:65px}
 .foot{min-height:67px;padding:3px 4px;gap:3px;flex-wrap:wrap;justify-content:center}
 .footGroup{width:100%;justify-content:center;gap:3px;flex-wrap:nowrap}
 .foot button{min-height:28px;font-size:10px;padding:0 5px}
 .foot select{min-height:28px}
 .workspace{padding:2px}
}
@media(max-height:620px){
 .top{min-height:35px;padding:2px 6px}
 .headerActions button{min-height:29px}
 .toolbar{min-height:34px;padding:2px 5px}
 .tool{min-height:30px}
 .controls{min-height:31px;padding:2px 6px}
 .foot{min-height:34px;padding:2px 5px}
 .foot button{min-height:27px}
}

/* V2.3 — edge-to-edge writing surface, with a dimensionally accurate virtual board. */
.workspace{padding:0!important;display:block;background:#fff;background-image:none}
.stage{width:100%;height:100%;outline:0;box-shadow:none;border:0;border-radius:0}
@media(max-width:680px){.workspace{padding:0!important}}
/* V2.3 — precise and free-form angles; visible only when the angle tool is active. */
.angleControls{display:flex;gap:7px;align-items:center;min-height:44px;padding:5px 10px;background:#f0f7ff;border-top:1px solid #dce9f9;border-bottom:1px solid #dce9f9;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex-shrink:0}
.angleControls .angle-label{font-size:12px;font-weight:800;color:#234f89}
.angleControls .preset{min-height:31px;padding:2px 9px;flex:none;border-radius:8px;font-size:12px}
.angleControls .preset.active{background:#2563cf;color:white;border-color:#2563cf}
.angleControls .angle-field{display:flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:#24486b}
.angleControls input[type=number]{width:68px;min-height:30px;padding:2px 5px;border:1px solid #a9bfdd;border-radius:7px;background:white;color:#233a58;text-align:center;font-size:14px;font-weight:700}
.angleControls select{min-height:31px;max-width:none;font-size:12px}
.angleControls .angle-check{font-size:12px;color:#24486b;display:flex;align-items:center;gap:3px}
.angleControls .angle-check input{accent-color:#2365cf;width:16px;height:16px}
.angleControls .angle-guide{font-size:11px;color:#4b6a8c}
@media(max-width:680px){.angleControls{min-height:40px;padding:4px 6px;gap:5px}.angleControls .preset{min-height:29px;padding:2px 7px}.angleControls .angle-guide{display:none}}
@media print{body{overflow:auto}.top,.toolbar,.controls,.foot,.status,.modalBackdrop{display:none!important}.app,.workspace{display:block;height:auto}.stage{width:100%!important;height:auto!important;box-shadow:none}.stage canvas{height:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="branding"><div class="logo" aria-hidden="true">▣</div><div class="brandtext"><strong>教室多功能白板 <span style="color:#2164cf">V2.3</span></strong><small>離線教學版 · 可儲存多頁課程</small></div></div>
  <div class="headerActions">
    <button id="undoBtn" title="復原（Ctrl+Z）">↶ 復原</button><button id="redoBtn" title="重做（Ctrl+Y）">↷ 重做</button>
    <button id="clearBtn" title="清除本頁物件">清空本頁</button><button id="fullBtn" title="進入或退出全螢幕">⛶ 全螢幕</button><button id="helpBtn">? 說明</button>
  </div>
</header>
<div class="workspace" id="workspace">
  <div class="stage" id="stage"><canvas id="board" aria-label="可使用觸控筆或滑鼠書寫的教學白板"></canvas></div>
</div>
<nav class="toolbar" aria-label="白板繪圖工具">
  <button class="tool" data-tool="select" title="選取、拖曳、調整大小"><span class="ico">⌖</span>選取</button>
  <button class="tool current" data-tool="pen" title="手寫筆"><span class="ico">✎</span>畫筆</button>
  <button class="tool" data-tool="smart" title="自動辨識直線、圓形"><span class="ico">✧</span>智慧筆</button>
  <button class="tool" data-tool="eraser" title="橡皮擦"><span class="ico">▧</span>橡皮擦</button>
  <button class="tool" data-tool="line" title="畫直線"><span class="ico">╱</span>直線</button>
  <button class="tool" data-tool="ellipse" title="畫圓形／橢圓"><span class="ico">◯</span>圓形</button>
  <button class="tool" data-tool="rect" title="畫長方形"><span class="ico">▭</span>長方形</button>
  <button class="tool" data-tool="triangle" title="畫三角形"><span class="ico">△</span>三角形</button>
  <button class="tool" data-tool="arrow" title="畫箭頭"><span class="ico">➜</span>箭頭</button>
  <button class="tool" data-tool="angle" title="設定精確角度或自由畫角"><span class="ico">∠</span>角度</button>
  <button class="tool" data-tool="text" title="點選白板插入文字"><span class="ico">T</span>文字</button>
  <button class="tool" data-tool="image" title="插入圖片"><span class="ico">▧</span>圖片</button>
</nav>
<div class="controls" aria-label="繪圖設定">
 <div class="controlGroup" id="colors" aria-label="筆色"><span>顏色</span><button class="swatch selected" data-color="#111827" title="黑色" aria-label="黑色" aria-pressed="true"></button><button class="swatch" data-color="#e33139" title="紅色" aria-label="紅色" aria-pressed="false"></button><button class="swatch" data-color="#2167d8" title="藍色" aria-label="藍色" aria-pressed="false"></button><button class="swatch" data-color="#16834a" title="綠色" aria-label="綠色" aria-pressed="false"></button></div>
 <label class="controlGroup">筆畫 <input id="penSize" type="range" min="2" max="28" step="1" value="6" aria-label="畫筆粗細"><output id="penSizeOut">6px</output></label>
 <label class="controlGroup">橡皮擦 <input id="eraserSize" type="range" min="12" max="110" step="2" value="36" aria-label="橡皮擦大小"><output id="eraserSizeOut">36px</output></label>
 <label class="controlGroup">背景 <select id="background"><option value="blank">純白</option><option value="grid">方格紙</option><option value="lines">橫線紙</option><option value="tian">田字格</option><option value="mi">米字格</option><option value="coords">座標平面</option></select></label>
 <label class="checkLabel" title="啟用後只有觸控筆可在白板書寫；滑鼠仍可測試操作"><input id="penOnly" type="checkbox">只用觸控筆</label>
 <button id="editBtn" title="選取文字後編輯；選取其他物件可複製" disabled>編輯選取</button><button id="dupBtn" title="複製目前選取物件" disabled>複製物件</button><button id="deleteObjBtn" title="刪除目前選取物件" disabled>刪除物件</button>
</div>
<div class="angleControls hidden" id="angleControls" aria-label="角度工具設定">
 <span class="angle-label">角度</span>
 <button type="button" class="preset" data-angle-preset="30">30°</button>
 <button type="button" class="preset" data-angle-preset="45">45°</button>
 <button type="button" class="preset" data-angle-preset="60">60°</button>
 <button type="button" class="preset" data-angle-preset="90">90°</button>
 <button type="button" class="preset" data-angle-preset="120">120°</button>
 <button type="button" class="preset" data-angle-preset="135">135°</button>
 <button type="button" class="preset" data-angle-preset="180">180°</button>
 <button type="button" class="preset" data-angle-preset="270">270°</button>
 <label class="angle-field">自訂 <input id="angleDegrees" type="number" min="0" max="360" step="0.1" inputmode="numeric" value="60" aria-label="角度數值（0到360度）">°</label>
 <label class="angle-field">模式 <select id="angleMode" aria-label="繪製角度模式"><option value="exact">精確角度</option><option value="free">自由畫角</option></select></label>
 <label class="angle-field">開口 <select id="angleDirection" aria-label="角度開口方向"><option value="cw">順時針</option><option value="ccw">逆時針</option></select></label>
 <label class="angle-check"><input id="angleLabel" type="checkbox" checked>顯示度數</label>
 <span class="angle-guide" id="angleGuide">拖曳決定角的頂點、射線長度與旋轉方向</span>
</div>
<footer class="foot">
 <div class="footGroup"><button id="prevBtn" title="上一頁">‹ 上一頁</button><span class="pageInfo" id="pageInfo">第 1 / 1 頁</span><button id="nextBtn" title="下一頁">下一頁 ›</button><select id="pageSelect" aria-label="選擇頁面"></select><button id="newPageBtn" class="primary" title="新增空白頁">＋ 新增頁</button><button id="duplicatePageBtn" title="複製目前頁面">複製頁</button><button id="deletePageBtn" title="刪除目前頁面">刪除頁</button></div>
 <div class="footGroup"><button id="pngBtn" title="將目前整頁匯出為 PNG">PNG</button><button id="pdfBtn" class="primary" title="將所有頁面合成 PDF">多頁 PDF</button><button id="saveBtn" title="下載可再次編輯的 JSON 專案檔">儲存專案</button><button id="loadBtn" title="開啟之前儲存的 JSON 專案">載入專案</button></div>
 <span class="footerHint" id="footerHint">滑鼠、觸控筆、觸控螢幕皆可操作</span>
</footer>
</div>
<input class="hidden" type="file" id="imageFile" accept="image/png,image/jpeg,image/webp">
<input class="hidden" type="file" id="projectFile" accept=".json,application/json">
<div class="status" id="toast" role="status" aria-live="polite"></div>
<div class="modalBackdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle">插入文字</h2><div id="modalBody"></div><div class="actions"><button id="modalCancel">取消</button><button id="modalOkay" class="emphasis">確定</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), BASE_W=1440,BASE_H=810,STORAGE='meiki-whiteboard-v2';
let W=BASE_W,H=BASE_H;
const canvas=$('board'), ctx=canvas.getContext('2d',{alpha:false}),stage=$('stage'),workspace=$('workspace');
let pages=[newPage()],active=0,tool='pen',color='#111827',penWidth=6,eraserSize=36,selectedId=null;
let angleDegrees=60,angleMode='exact',angleDirection='cw',angleShowLabel=true;
let pointerId=null, interaction=null, preview=null, hover=null, modalCallback=null, db=null, saveTimer=0,toastTimer=0,lastPenTime=-Infinity;
let undoStack=[],redoStack=[],imageCache=new Map(),renderPending=false, projectTitle='我的教學白板';
function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function newPage(){return {id:uid(),background:'blank',objects:[]}}
const clone=obj=>JSON.parse(JSON.stringify(obj));
function snapshot(){return JSON.stringify({pages,active})}
function checkpoint(){undoStack.push(snapshot());if(undoStack.length>25)undoStack.shift();redoStack=[];updateUndoBtns()}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restoreSnapshot(undoStack.pop());updateUndoBtns();scheduleSave()}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restoreSnapshot(redoStack.pop());updateUndoBtns();scheduleSave()}
function restoreSnapshot(s){const d=JSON.parse(s);pages=d.pages;active=d.active;selectedId=null;preview=null;interaction=null;syncPageUI();resize()}
function updateUndoBtns(){$('undoBtn').disabled=undoStack.length===0;$('redoBtn').disabled=redoStack.length===0}
const page=()=>pages[active];
function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function safeDownload(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function filename(s){return (s||'教學白板').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').slice(0,45)}
function syncPageUI(){$('pageInfo').textContent=`第 ${active+1} / ${pages.length} 頁`;$('prevBtn').disabled=active===0;$('nextBtn').disabled=active===pages.length-1;$('deletePageBtn').disabled=pages.length===1;$('pageSelect').replaceChildren(...pages.map((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent='第 '+(i+1)+' 頁';return o}));$('pageSelect').value=active;$('background').value=page().background;updateSelectionUI();updateUndoBtns();requestDraw()}

function setTool(t){tool=t;preview=null;selectedId=null;$('angleControls').classList.toggle('hidden',t!=='angle');document.querySelectorAll('[data-tool]').forEach(b=>{b.classList.toggle('current',b.dataset.tool===t);b.setAttribute('aria-pressed',b.dataset.tool===t?'true':'false')});stage.classList.toggle('select-mode',t==='select');stage.classList.toggle('eraser-mode',t==='eraser');updateSelectionUI();requestDraw();if(t==='image')$('imageFile').click()}
function resize(){const r=workspace.getBoundingClientRect();if(r.width<5||r.height<5)return;
 // Keep the entire original 1440×810 board visible while extending the writing area
 // sideways (or vertically) to fit the screen. Equal X/Y scale preserves circles.
 let minW=BASE_W,minH=BASE_H;
 for(const p of pages)for(const o of p.objects){const b=bounds(o);if(Number.isFinite(b.x+b.w))minW=Math.max(minW,Math.min(10000,b.x+b.w+12));if(Number.isFinite(b.y+b.h))minH=Math.max(minH,Math.min(10000,b.y+b.h+12))}
 const width=r.width,height=r.height,scale=Math.min(width/minW,height/minH);
 W=Math.max(BASE_W,Math.round(width/scale));H=Math.max(BASE_H,Math.round(height/scale));
 stage.style.width=width+'px';stage.style.height=height+'px';
 const dpr=Math.min(window.devicePixelRatio||1,2),pxw=Math.max(1,Math.round(width*dpr)),pxh=Math.max(1,Math.round(height*dpr));
 if(canvas.width!==pxw||canvas.height!==pxh){canvas.width=pxw;canvas.height=pxh}requestDraw()}
function requestDraw(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;render()})}
function render(){if(!canvas.width)return;ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);drawScene(ctx,page(),{selection:true,preview:true})}
function background(c,p){c.save();c.fillStyle='#fff';c.fillRect(0,0,W,H);const kind=p.background;if(kind==='blank'){c.restore();return}c.lineWidth=1;c.strokeStyle='#dce6f1';if(kind==='grid'||kind==='coords'){const step=45;c.beginPath();for(let x=0;x<=W;x+=step){c.moveTo(x,0);c.lineTo(x,H)}for(let y=0;y<=H;y+=step){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();if(kind==='coords'){const ox=720,oy=405;c.strokeStyle='#829ab3';c.lineWidth=2;c.beginPath();c.moveTo(0,oy);c.lineTo(W,oy);c.moveTo(ox,0);c.lineTo(ox,H);c.stroke();c.fillStyle='#536f8e';c.font='17px system-ui';c.fillText('0',ox+10,oy+24);c.fillText('x',W-22,oy-8);c.fillText('y',ox+12,20);for(let x=ox%step;x<W;x+=step){c.beginPath();c.moveTo(x,oy-6);c.lineTo(x,oy+6);c.stroke()}for(let y=oy%step;y<H;y+=step){c.beginPath();c.moveTo(ox-6,y);c.lineTo(ox+6,y);c.stroke()}}}
 else if(kind==='lines'){c.beginPath();for(let y=75;y<=H;y+=62){c.moveTo(0,y);c.lineTo(W,y)}c.stroke()}
 else if(kind==='tian'||kind==='mi'){const s=125;c.strokeStyle='#bfd0e6';for(let x=0;x<W;x+=s){for(let y=0;y<H;y+=s){c.strokeRect(x+.5,y+.5,s,s);c.save();c.setLineDash([7,6]);c.strokeStyle='#d4dfe9';c.beginPath();c.moveTo(x+s/2,y);c.lineTo(x+s/2,y+s);c.moveTo(x,y+s/2);c.lineTo(x+s,y+s/2);if(kind==='mi'){c.moveTo(x,y);c.lineTo(x+s,y+s);c.moveTo(x+s,y);c.lineTo(x,y+s)}c.stroke();c.restore()}}}c.restore()}
function strokeLine(c,o){const pts=o.points||[];if(!pts.length)return;c.beginPath();c.moveTo(pts[0].x,pts[0].y);if(pts.length===1){c.lineTo(pts[0].x+.01,pts[0].y+.01)}else{for(let i=1;i<pts.length-1;i++){const mid={x:(pts[i].x+pts[i+1].x)/2,y:(pts[i].y+pts[i+1].y)/2};c.quadraticCurveTo(pts[i].x,pts[i].y,mid.x,mid.y)}c.lineTo(pts[pts.length-1].x,pts[pts.length-1].y)}c.stroke()}
function imageObj(src){let o=imageCache.get(src);if(o)return o;const img=new Image();o={img,ready:false};imageCache.set(src,o);img.onload=()=>{o.ready=true;requestDraw()};img.onerror=()=>{o.error=true;requestDraw()};img.src=src;return o}
// New angle objects store exact degrees independent of pixel aspect ratio.
// Legacy V2.2 right-angle shapes have no angleDeg and keep their former renderer.
function angleGeometry(o){
 const len=Math.max(12,Math.hypot((o.x2||0)-(o.x1||0),(o.y2||0)-(o.y1||0)));
 const from=((Number(o.startDeg)||0)%360+360)%360*Math.PI/180;
 const sweep=clamp(Number(o.angleDeg)||0,0,360)*Math.PI/180;
 const dir=o.angleDir==='ccw'?-1:1;
 const to=from+dir*sweep;
 const rayA={x:o.x1+Math.cos(from)*len,y:o.y1+Math.sin(from)*len};
 const rayB={x:o.x1+Math.cos(to)*len,y:o.y1+Math.sin(to)*len};
 return {len,from,to,sweep,dir,rayA,rayB};
}
function drawExactAngle(c,o){
 const g=angleGeometry(o),r=clamp(g.len*.30,22,68);
 c.beginPath();c.moveTo(g.rayA.x,g.rayA.y);c.lineTo(o.x1,o.y1);c.lineTo(g.rayB.x,g.rayB.y);c.stroke();
 if(g.sweep>0){c.save();c.lineWidth=Math.max(1.6,(o.width||6)*.44);c.beginPath();c.arc(o.x1,o.y1,r,g.from,g.to,g.dir<0);c.stroke();c.restore()}
 if(o.showLabel!==false){
   const mid=g.from+g.dir*g.sweep/2,dist=r+27,delta=g.sweep<.18?25:0;
   const tx=o.x1+Math.cos(mid)*(dist+delta),ty=o.y1+Math.sin(mid)*(dist+delta);
   const label=Math.round((+o.angleDeg||0)*10)/10+'°';
   c.save();c.font='bold '+Math.max(19,(o.width||6)*3.5)+'px "Microsoft JhengHei",system-ui,sans-serif';
   c.textAlign='center';c.textBaseline='middle';
   // White outline keeps the measurement legible over grids and other strokes.
   c.lineWidth=5;c.strokeStyle='#fff';c.strokeText(label,tx,ty);c.fillStyle=o.color||'#111827';c.fillText(label,tx,ty);c.restore();
 }
}
function drawObject(c,o){c.save();c.strokeStyle=o.color||'#111827';c.fillStyle=o.color||'#111827';c.lineWidth=o.width||6;c.lineCap='round';c.lineJoin='round';const {x1=0,y1=0,x2=0,y2=0}=o;const x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);
 if(o.t==='stroke'){strokeLine(c,o)}
 else if(o.t==='line'||o.t==='arrow'){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();if(o.t==='arrow'){const ang=Math.atan2(y2-y1,x2-x1),len=Math.max(18,(o.width||6)*3.3);c.beginPath();c.moveTo(x2-len*Math.cos(ang-.55),y2-len*Math.sin(ang-.55));c.lineTo(x2,y2);c.lineTo(x2-len*Math.cos(ang+.55),y2-len*Math.sin(ang+.55));c.stroke()}}
 else if(o.t==='ellipse'){c.beginPath();c.ellipse(x+w/2,y+h/2,Math.max(.01,w/2),Math.max(.01,h/2),0,0,2*Math.PI);c.stroke()}
 else if(o.t==='rect'){c.strokeRect(x,y,w,h)}
 else if(o.t==='triangle'){c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath();c.stroke()}
 else if(o.t==='angle'){if(Number.isFinite(o.angleDeg))drawExactAngle(c,o);else{const s=Math.sign((x2-x1)||(1)),t=Math.sign((y2-y1)||(1)),r=Math.min(Math.abs(x2-x1),Math.abs(y2-y1),55);c.beginPath();c.moveTo(x1,y2);c.lineTo(x1,y1);c.lineTo(x2,y1);c.stroke();c.lineWidth=Math.max(2,(o.width||6)/2);c.beginPath();c.arc(x1,y1,r,t>0?0:-Math.PI/2,s>0?(t>0?Math.PI/2:0):(t>0?Math.PI:Math.PI/2),s!==t);c.stroke()}}
 else if(o.t==='text'){c.textBaseline='top';c.font=`${o.size||38}px "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif`;const lines=(o.text||'').split('\n'),dy=(o.size||38)*1.3;lines.forEach((s,i)=>c.fillText(s,o.x,o.y+dy*i))}
 else if(o.t==='image'){const v=imageObj(o.src);if(v.ready){c.drawImage(v.img,o.x,o.y,o.w,o.h)}else{c.fillStyle='#edf1f6';c.fillRect(o.x,o.y,o.w,o.h);c.fillStyle='#6b7e92';c.font='23px system-ui';c.fillText(v.error?'圖片無法載入':'圖片載入中',o.x+15,o.y+30)}}c.restore()}
function drawScene(c,p,{selection=false,preview:showPreview=false}={}){background(c,p);for(const o of p.objects)drawObject(c,o);if(showPreview&&preview){if(preview.t==='erase-preview'){c.save();c.beginPath();c.arc(preview.x,preview.y,eraserSize/2,0,Math.PI*2);c.fillStyle='#ff505026';c.strokeStyle='#df4d4d';c.lineWidth=2;c.fill();c.stroke();c.restore()}else{c.save();c.globalAlpha=.7;drawObject(c,preview);c.restore()}}
 if(selection&&selectedId){const o=p.objects.find(x=>x.id===selectedId);if(o){const b=bounds(o,c);c.save();c.strokeStyle='#1566dd';c.lineWidth=2;c.setLineDash([8,5]);c.strokeRect(b.x-9,b.y-9,Math.max(18,b.w+18),Math.max(18,b.h+18));c.setLineDash([]);c.fillStyle='#fff';c.strokeStyle='#1566dd';c.lineWidth=3;const handles=[{x:b.x+b.w,y:b.y+b.h}];for(const h of handles){c.fillRect(h.x-9,h.y-9,18,18);c.strokeRect(h.x-9,h.y-9,18,18)}c.restore()}}}
function bounds(o,c=ctx){if(o.t==='stroke'){const a=o.points;if(!a.length)return{x:0,y:0,w:0,h:0};let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(let p of a){xmin=Math.min(xmin,p.x);xmax=Math.max(xmax,p.x);ymin=Math.min(ymin,p.y);ymax=Math.max(ymax,p.y)}return{x:xmin,y:ymin,w:xmax-xmin,h:ymax-ymin}}
 if(o.t==='text'){c.save();c.font=`${o.size||38}px "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif`;let w=Math.max(18,...o.text.split('\n').map(s=>c.measureText(s).width));c.restore();return {x:o.x,y:o.y,w,h:o.text.split('\n').length*(o.size||38)*1.3}}
 if(o.t==='image')return {x:o.x,y:o.y,w:o.w,h:o.h};if(o.t==='angle'&&Number.isFinite(o.angleDeg)){const g=angleGeometry(o);const rad=clamp(g.len*.3,22,68)+62;const xs=[o.x1,g.rayA.x,g.rayB.x],ys=[o.y1,g.rayA.y,g.rayB.y];if(g.sweep>0){const n=Math.max(6,Math.ceil(g.sweep/(Math.PI/24)));for(let k=0;k<=n;k++){const a=g.from+g.dir*g.sweep*k/n;xs.push(o.x1+rad*Math.cos(a));ys.push(o.y1+rad*Math.sin(a))}}return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)}}
function xy(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)/r.width*W)),y:Math.max(0,Math.min(H,(e.clientY-r.top)/r.height*H))}}
function distToSegment(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=dx*dx+dy*dy?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy))):0;return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function hit(o,p,pad=10){const b=bounds(o),wide=Math.max(12,(o.width||0)/2+pad);if(o.t==='stroke'){if(!o.points.length)return false;for(let i=1;i<o.points.length;i++)if(distToSegment(p,o.points[i-1],o.points[i])<=wide)return true;return o.points.some(a=>Math.hypot(a.x-p.x,a.y-p.y)<wide)}if(o.t==='line'||o.t==='arrow')return distToSegment(p,{x:o.x1,y:o.y1},{x:o.x2,y:o.y2})<=wide;if(o.t==='text'||o.t==='image')return p.x>=b.x-pad&&p.x<=b.x+b.w+pad&&p.y>=b.y-pad&&p.y<=b.y+b.h+pad;if(p.x<b.x-pad||p.x>b.x+b.w+pad||p.y<b.y-pad||p.y>b.y+b.h+pad)return false;if(o.t==='rect'||o.t==='ellipse'||o.t==='triangle'||o.t==='angle')return true;return false}
function findHit(p){for(let i=page().objects.length-1;i>=0;i--)if(hit(page().objects[i],p))return page().objects[i];return null}
function moveObject(o,orig,dx,dy){if(orig.t==='stroke'){o.points=orig.points.map(p=>({x:clamp(p.x+dx,0,W),y:clamp(p.y+dy,0,H)}))}else if(orig.t==='text'||orig.t==='image'){o.x=clamp(orig.x+dx,0,W);o.y=clamp(orig.y+dy,0,H)}else{o.x1=clamp(orig.x1+dx,0,W);o.y1=clamp(orig.y1+dy,0,H);o.x2=clamp(orig.x2+dx,0,W);o.y2=clamp(orig.y2+dy,0,H)}}
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function scaleObject(o,orig,origin,sx,sy){sx=clamp(sx,.1,15);sy=clamp(sy,.1,15);if(orig.t==='stroke'){o.points=orig.points.map(p=>({x:origin.x+(p.x-origin.x)*sx,y:origin.y+(p.y-origin.y)*sy}))}else if(orig.t==='image'){o.x=orig.x;o.y=orig.y;o.w=Math.max(20,orig.w*sx);o.h=Math.max(20,orig.h*sy)}else if(orig.t==='text'){o.size=Math.round(clamp(orig.size*Math.max(sx,sy),12,220))}else{o.x1=origin.x+(orig.x1-origin.x)*sx;o.y1=origin.y+(orig.y1-origin.y)*sy;o.x2=origin.x+(orig.x2-origin.x)*sx;o.y2=origin.y+(orig.y2-origin.y)*sy}}
function pointWithinHandle(p,b){return Math.hypot(p.x-(b.x+b.w),p.y-(b.y+b.h))<24}
function makeAngleShape(a,b,mode=angleMode){
 const raw=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
 const direction=angleDirection==='ccw'?-1:1;
 const measured=(direction*raw%360+360)%360;
 const angle=mode==='free'?Math.round(measured*10)/10:angleDegrees;
 return {t:'angle',x1:a.x,y1:a.y,x2:b.x,y2:b.y,color,width:penWidth,angleDeg:angle,
    startDeg:mode==='free'?0:(raw+360)%360,angleDir:angleDirection,showLabel:angleShowLabel};
}
function updateAngleSettings(){
 document.querySelectorAll('[data-angle-preset]').forEach(b=>b.classList.toggle('active',angleMode==='exact'&&Number(b.dataset.anglePreset)===angleDegrees));
 $('angleGuide').textContent=angleMode==='free'?'從頂點向第二射線拖曳，可畫任意角度':'拖曳決定頂點、射線長度與旋轉方向';

function onDown(e){if(pointerId!==null)return;if(e.button!==undefined&&e.button!==0)return;if(e.pointerType==='pen')lastPenTime=performance.now();if($('penOnly').checked&&e.pointerType==='touch'&&tool!=='select'){toast('已啟用「只用觸控筆」');return}if(e.pointerType==='touch'&&performance.now()-lastPenTime<750&&tool!=='select')return;
 e.preventDefault();const p=xy(e);pointerId=e.pointerId;try{canvas.setPointerCapture(pointerId)}catch{};hover=p;
 if(tool==='select'){const sel=page().objects.find(o=>o.id===selectedId);if(sel&&pointWithinHandle(p,bounds(sel))){checkpoint();interaction={kind:'resize',start:p,id:sel.id,original:clone(sel),b:bounds(sel)};requestDraw();return}const hitObj=findHit(p);selectedId=hitObj?hitObj.id:null;updateSelectionUI();if(hitObj){checkpoint();interaction={kind:'move',start:p,id:hitObj.id,original:clone(hitObj)}}else interaction={kind:'idle'};requestDraw();return}
 if(tool==='text'){pointerId=null;try{canvas.releasePointerCapture(e.pointerId)}catch{};showTextModal(p,null);return}
 if(tool==='image'){pointerId=null;try{canvas.releasePointerCapture(e.pointerId)}catch{};$('imageFile').click();return}
 if(tool==='eraser'){interaction={kind:'erase',pts:[p]};preview={t:'erase-preview',...p};requestDraw();return}
 if(tool==='pen'||tool==='smart'){interaction={kind:'stroke',pts:[p]};preview={t:'stroke',points:[p],width:penWidth,color};requestDraw();return}
 interaction={kind:'shape',start:p,angleMode:tool==='angle'?angleMode:null};preview=tool==='angle'?makeAngleShape(p,{x:p.x+1,y:p.y},angleMode):{t:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,width:penWidth};requestDraw()}
function onMove(e){const p=xy(e);hover=p;if(pointerId!==e.pointerId){if(tool==='eraser'){preview={t:'erase-preview',...p};requestDraw()}return}e.preventDefault();if(!interaction)return;
 if(interaction.kind==='move'){const o=page().objects.find(x=>x.id===interaction.id);if(o)moveObject(o,interaction.original,p.x-interaction.start.x,p.y-interaction.start.y)}
 else if(interaction.kind==='resize'){const o=page().objects.find(x=>x.id===interaction.id);if(o){const b=interaction.b;const sx=(p.x-b.x)/Math.max(1,b.w),sy=(p.y-b.y)/Math.max(1,b.h);scaleObject(o,interaction.original,{x:b.x,y:b.y},sx,sy)}}
 else if(interaction.kind==='stroke'){const pts=interaction.pts;const last=pts[pts.length-1];if(Math.hypot(last.x-p.x,last.y-p.y)>1.2){pts.push(p);preview={t:'stroke',points:pts,width:penWidth,color}}}
 else if(interaction.kind==='shape'){if(preview.t==='angle')preview=makeAngleShape(interaction.start,p,interaction.angleMode);else{preview.x2=p.x;preview.y2=p.y}}
 else if(interaction.kind==='erase'){const pts=interaction.pts,last=pts[pts.length-1];if(Math.hypot(last.x-p.x,last.y-p.y)>2)pts.push(p);preview={t:'erase-preview',...p}}
 requestDraw()}
function onUp(e){if(pointerId!==e.pointerId)return;e.preventDefault();const p=xy(e);const it=interaction;pointerId=null;interaction=null;try{canvas.releasePointerCapture(e.pointerId)}catch{};
 if(!it){preview=null;requestDraw();return}
 if(it.kind==='stroke'){const pts=it.pts.slice();if(pts.length===1||Math.hypot(pts[pts.length-1].x-p.x,pts[pts.length-1].y-p.y)>1)pts.push(p);const o={id:uid(),t:'stroke',points:pts,color,width:penWidth};checkpoint();page().objects.push(tool==='smart'?smartify(o):o)}
 else if(it.kind==='shape'){if(Math.hypot(it.start.x-p.x,it.start.y-p.y)>4){checkpoint();let o=tool==='angle'?{id:uid(),...makeAngleShape(it.start,p,it.angleMode)}:{id:uid(),t:tool,x1:it.start.x,y1:it.start.y,x2:p.x,y2:p.y,color,width:penWidth};if(o.t==='ellipse'&&e.shiftKey){const s=Math.max(Math.abs(o.x2-o.x1),Math.abs(o.y2-o.y1));o.x2=o.x1+Math.sign(o.x2-o.x1||1)*s;o.y2=o.y1+Math.sign(o.y2-o.y1||1)*s}page().objects.push(o)}}
 else if(it.kind==='erase'){eraseAt(it.pts.concat([p]))}
 else if(it.kind==='move'||it.kind==='resize'){const o=page().objects.find(x=>x.id===it.id);if(o&&JSON.stringify(o)===JSON.stringify(it.original)){undoStack.pop();updateUndoBtns()}}
